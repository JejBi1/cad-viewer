[package]
name = "cad-app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "StepViewer"
path = "src/main.rs"

[dependencies]
cad-types.workspace = true
occt-bridge.workspace = true
cad-core.workspace = true
cad-2d.workspace = true
cad-render.workspace = true
glam.workspace = true
cad-drive.workspace = true
eframe.workspace = true
rfd.workspace = true
image.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_Input",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
winreg = "0.56"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile.workspace = true
