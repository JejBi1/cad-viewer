[package]
name = "rdxf"
version = "0.1.0"
edition = "2021"
publish = false
description = "Hot loops of the CAD viewer's 2D (DXF) renderer: z-order preserving batching of drawing primitives"

[dependencies]
numpy = "0.30.0"
pyo3 = { version = "0.30.1", features = ["extension-module", "abi3-py311"] }

[lib]
name = "rdxf"
crate-type = ["cdylib"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
# no panic = "abort": a Rust panic must reach Python as an exception (view2d then falls back to the legacy renderer),
# not kill the viewer
